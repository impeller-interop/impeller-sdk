name: Native C test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native C test (${{ matrix.platform }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux x64
            runs_on: ubuntu-latest
          - platform: linux arm64
            runs_on: ubuntu-24.04-arm
          - platform: macOS x64
            runs_on: macos-15-intel
          - platform: macOS arm64
            runs_on: macos-latest
          - platform: windows x64
            runs_on: windows-latest
          - platform: windows arm64
            runs_on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native test
        uses: ./.github/actions/native-test

  required:
    name: Native C test
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = "success"

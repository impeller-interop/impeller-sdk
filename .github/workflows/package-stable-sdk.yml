name: Package Stable Impeller SDK

on:
  # Run automatically every 24 hours at 01:00 UTC, leaving Flutter artifacts
  # about one hour to finish publishing.
  schedule:
    - cron: "0 1 * * *"

  # Allow manual trigger.
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Optional Flutter engine SHA
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Package SDK assets
        id: package
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --channel stable
            --out dist
            --sdk sdk
            --zon build.zig.zon
            --bump-patch
            --skip-release
          )

          if [[ -n "${{ inputs.engine_sha || '' }}" ]]; then
            args+=(--sha "${{ inputs.engine_sha }}")
          fi

          python3 tools/package_sdk.py "${args[@]}"

      - name: Run native C test before commit
        uses: ./.github/actions/native-test

      - name: Check for SDK changes
        if: ${{ steps.package.outputs.skipped != 'true' }}
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add build.zig.zon README.md sdk
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SDK changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SDK changed."
          fi

      - name: Commit SDK changes
        if: ${{ steps.package.outputs.skipped != 'true' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sdk): update stable SDK"

          version="$(grep -oP '^\s*\.version = "\K[^"]+' build.zig.zon | head -1)"
          refspecs=(HEAD:main)
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            git tag -a "v$version" -m "v$version"
            refspecs+=("refs/tags/v$version")
          fi
          git push origin "${refspecs[@]}"

      - name: Publish SDK assets
        if: ${{ steps.package.outputs.skipped != 'true' && steps.changes.outputs.changed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: main
          files: |
            dist/*.tar.gz
            dist/lazy-deps.zigzon
            dist/sdk-metadata.json
          body: |
            Generated stable Impeller SDK packages for engine `${{ steps.package.outputs.engine_sha }}`.

            The `sdk/` directory in `main` contains the combined SDK tree.
            `lazy-deps.zigzon` contains the dependency entries generated for `build.zig.zon`.

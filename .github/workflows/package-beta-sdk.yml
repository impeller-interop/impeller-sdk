name: Package Beta Impeller SDK

on:
  # Run automatically every 24 hours at 01:00 UTC, leaving Flutter artifacts
  # about one hour to finish publishing.
  schedule:
    - cron: "0 1 * * *"

  # Allow manual trigger.
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Optional Flutter engine SHA
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Package SDK assets
        id: package
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --channel beta
            --out dist
            --sdk "$RUNNER_TEMP/beta-sdk"
            --skip-release
          )

          if [[ -n "${{ inputs.engine_sha || '' }}" ]]; then
            args+=(--sha "${{ inputs.engine_sha }}")
          fi

          python3 tools/package_sdk.py "${args[@]}"

      - name: Run native C test on beta artifacts
        if: ${{ steps.package.outputs.skipped != 'true' }}
        uses: ./.github/actions/native-test
        with:
          sdk_root: ${{ runner.temp }}/beta-sdk

      - name: Publish SDK assets
        if: ${{ steps.package.outputs.skipped != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          target_commitish: main
          files: |
            dist/*.tar.gz
            dist/lazy-deps.zigzon
            dist/sdk-metadata.json
          body: |
            Generated beta Impeller SDK packages for engine `${{ steps.package.outputs.engine_sha }}`.

            Beta artifacts are release-only. No SDK tree or dependency pins are committed.
